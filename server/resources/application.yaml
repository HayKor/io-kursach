ktor:
    application:
        modules:
            - ru.haykor.sudv.server.MainKt.module
    deployment:
        port: 8080

database:
    url: "$DB_URL:r2dbc:postgresql://localhost:5432/sudv"
    user: "$DB_USER:sudv"
    password: "$DB_PASSWORD:sudv"
    poolMaxSize: 10

app:
    timeZone: "$APP_TIME_ZONE:Europe/Moscow"

cors:
    # Comma-separated origins of browser clients; the web client's dev server runs on 8081 (8080 is this server).
    # Both spellings: the browser sends the address as typed, and `./kotlin run` prints the 127.0.0.1 one.
    allowedOrigins: "$CORS_ORIGINS:http://localhost:8081,http://127.0.0.1:8081"

web:
    # Directory with the built web-app (index.html, .mjs, .wasm); empty: the server serves the API only.
    # Locally: ./kotlin build -m web-app, then WEB_DIR=build/tasks/_web-app_buildWasmJsAppWasmJsDebug.
    dir: "$WEB_DIR:"

security:
    jwt:
        secret: "$JWT_SECRET:dev-only-secret-change-me"
        issuer: "sudv"
        ttlHours: 12
    passwordHashIterations: 600000

files:
    dir: "$FILES_DIR:build/files"
    # Maximum attachment size, bytes (10 MiB).
    maxAttachmentBytes: 10485760

expiry:
    schedulerEnabled: true
    # Local time of the daily run, HH:MM in app.timeZone.
    runAt: "00:05"

bootstrap:
    departments:
        - "Дирекция"
        - "Отдел кадров"
        - "Юридический отдел"
        - "ИТ-отдел"
        - "Бухгалтерия"
        - "Производственные подразделения"
    admin:
        login: "$ADMIN_LOGIN:admin"
        password: "$ADMIN_PASSWORD:admin12345"
        department: "ИТ-отдел"

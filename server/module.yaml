product: jvm/app

apply:
  - ../common.module-template.yaml

dependencies:
  - ../shared/domain
  - ../shared/contract
  - $libs.metro.runtime
  - $libs.ktor.server.core
  - $libs.ktor.server.netty
  - $libs.ktor.server.config.yaml
  - $libs.ktor.server.contentNegotiation
  - $libs.ktor.serialization.kotlinx.json
  - $libs.ktor.server.statusPages
  - $libs.ktor.server.callLogging
  - $libs.ktor.server.auth
  - $libs.ktor.server.auth.jwt
  - $libs.ktor.server.swagger
  - $libs.logback.classic
  - $libs.exposed.core
  - $libs.exposed.r2dbc
  - $libs.exposed.kotlin.datetime
  - $libs.r2dbc.postgresql
  - $libs.r2dbc.pool
  - $libs.fastexcel

test-dependencies:
  - $libs.ktor.server.testHost
  - $libs.ktor.client.contentNegotiation
  - $libs.testcontainers.postgresql
  - $libs.postgresql.driver

settings:
  ktor:
    enabled: true
    # Ktor versions come from libs.versions.toml
    applyBom: false
  kotlin:
    compilerPlugins:
      - id: dev.zacsweers.metro.compiler
        dependency: $libs.metro.compiler
      # infers OpenAPI paths and schemas from routing code (call.receive / call.respond)
      - id: io.ktor.ktor-compiler-plugin
        dependency: $libs.ktor.compiler.plugin
        options:
          openApiEnabled: true
          openApiCodeInference: true
  jvm:
    mainClass: ru.haykor.sudv.server.MainKt

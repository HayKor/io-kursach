product: wasm-js/app

dependencies:
  - //client-ui
  - //client-data

description: "WasmJs app entrypoint; contains its DI graph"

apply:
  - //common.module-template.yaml
  - //metro.module-template.yaml

settings:
  compose:
    enabled: true
  kotlin:
    # Kotlin/Wasm links modules by IR signatures; by default an unresolved call only throws IrLinkageError at runtime.
    freeCompilerArgs:
      - -Xpartial-linkage-loglevel=ERROR
